[tox]
envlist = py310, py311, py312, py313, py314
requires = tox-uv

[testenv]
extras = dev
setenv =
    COVERAGE_FILE = {envtmpdir}/.coverage
    MYPY_CACHE_DIR = {envtmpdir}/.mypy_cache
commands =
    ruff check acp_api.py tests/ locustfile.py
    ruff format --check acp_api.py tests/ locustfile.py
    mypy acp_api.py
    pytest -v -p no:cacheprovider --cov --cov-report=term-missing
