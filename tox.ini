[tox]
envlist = py310, py311, py312, py313, py314
skipsdist = True

[testenv]
deps =
    fastapi
    uvicorn
    pydantic
    sse-starlette
    httpx
    pytest
    pytest-asyncio
    pytest-mock
    pytest-cov
    ruff
    mypy
commands =
    ruff check acp_api.py tests/
    mypy --ignore-missing-imports acp_api.py
    pytest -m 'not integration' -v --cov=acp_api --cov-fail-under=95
