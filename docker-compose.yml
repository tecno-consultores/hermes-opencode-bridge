x-opencode-base: &opencode-base
    image: ghcr.io/anomalyco/opencode:latest
    hostname: opencode
    container_name: opencode  # Fijado a 'opencode' para hacer match con el código Python
    pull_policy: ${pull_policy}
    restart: ${restart}
    stdin_open: true
    tty: true
    networks:
      - acp-net
    environment:
      - TZ=${TIMEZONE}
      - OPENCODE_CONFIG_CONTENT=${OPENCODE_CONFIG_CONTENT}
    ports:
      - ${OCPORT}:${OCPORT}
    volumes:
      - ./opencode-workspace:/workspace
      - config-opencode:/root/.config/opencode
      - state-opencode:/root/.local/state/opencode
      - share-opencode:/root/.local/share/opencode
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c", "opencode web --hostname 0.0.0.0 --port ${OCPORT}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4096/global/health > /dev/null || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

x-hermes-base: &hermes-base
    image: nousresearch/hermes-agent:latest
    hostname: ${hname}
    container_name: ${hname}
    pull_policy: ${pull_policy}
    restart: ${restart}
    shm_size: "1gb"
    networks:
      - acp-net
    command: gateway run 
    environment:
      - PATH=/root/.local/bin:/opt/data/.local/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=${hdport}
      - HERMES_LOCAL_STT_LANGUAGE=es
      - TZ=${TIMEZONE}
      - HERMES_TIMEZONE=${TIMEZONE}
      - HERMES_DASHBOARD_TUI=1
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${hapikey}
      - API_SERVER_PORT=${hapiport}
      - API_SERVER_HOST=0.0.0.0
      - TERMINAL_ENV=local
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${huser}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${hpass}
      - HERMES_DASHBOARD_PUBLIC_URL=${HERMES_DASHBOARD_PUBLIC_URL}
      - HERMES_QUIET=true
      - learning_acp_orchestrator=${learning_acp_orchestrator}
    ports:
      - ${hapiport}:${hapiport}
      - ${hdport}:${hdport}
    volumes:
      - hermes:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opencode-workspace:/workspace
    group_add:
      - ${DOCKER_GID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${hapiport}/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

x-hermes-opencode-bridge-base: &hermes-opencode-bridge-base
    image: sinfallas/hermes-opencode-bridge:latest
    hostname: ${acpname}
    container_name: ${acpname}
    pull_policy: ${pull_policy}
    restart: ${restart}
    networks:
      - acp-net
    ports:
      - 8000:8000
    environment:
      - HERMES_API_KEY=${hapikey}
      - HERMES_API_URL=http://${hname}:${hapiport}/v1/chat/completions
      - TZ=${TIMEZONE}
      # Expuesto por si necesitas tunear el prompt del auditor en el futuro sin reconstruir la imagen
      - HERMES_SECURITY_PROMPT=${HERMES_SECURITY_PROMPT:-} 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GID}  # Crucial para que Python pueda ejecutar docker exec
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      start_period: 5s
      interval: 15s
      timeout: 5s
      retries: 3

################################################

networks:
  acp-net:
    driver: bridge

volumes:
  config-opencode:
  state-opencode:
  share-opencode:
  hermes:

################################################

services:
    opencode:
        <<: *opencode-base
        profiles: ["opencode", "acp-orchestrator"]

    hermes:
        <<: *hermes-base
        profiles: ["hermes", "acp-orchestrator"]

    acp-orchestrator:
        <<: *hermes-opencode-bridge-base
        profiles: ["acp-orchestrator"]
        depends_on:
          opencode:
            condition: service_healthy  # Bloquea el arranque hasta que wget responda
          hermes:
            condition: service_healthy  # Bloquea el arranque hasta que curl responda
