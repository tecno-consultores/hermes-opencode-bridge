# Stack completo: docker compose --env-file .env --profile acp-orchestrator up -d

x-opencode-base: &opencode-base
    image: ghcr.io/anomalyco/opencode:${OPENCODE_TAG:-latest}
    hostname: opencode
    container_name: opencode
    pull_policy: ${pull_policy:-missing}
    restart: ${restart:-unless-stopped}
    networks:
      - acp-net
    environment:
      - TZ=${TIMEZONE}
      - OPENCODE_CONFIG_CONTENT=${OPENCODE_CONFIG_CONTENT}
      # Autenticación HTTP Basic de la interfaz web de OpenCode
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:?Defina OPENCODE_SERVER_USERNAME en .env}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?Defina OPENCODE_SERVER_PASSWORD en .env}
    ports:
      # Por defecto solo en loopback; use OCBIND=0.0.0.0 únicamente detrás de un proxy inverso con TLS.
      - ${OCBIND:-127.0.0.1}:${OCPORT}:${OCPORT}
    volumes:
      - ./opencode-workspace:/workspace
      - config-opencode:/root/.config/opencode
      - state-opencode:/root/.local/state/opencode
      - share-opencode:/root/.local/share/opencode
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c", "opencode web --hostname 0.0.0.0 --port ${OCPORT}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header \"Authorization: Basic $$(printf '%s:%s' \"$$OPENCODE_SERVER_USERNAME\" \"$$OPENCODE_SERVER_PASSWORD\" | base64)\" http://127.0.0.1:${OCPORT}/global/health > /dev/null || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

x-hermes-base: &hermes-base
    image: nousresearch/hermes-agent:${HERMES_TAG:-latest}
    hostname: ${hname}
    container_name: ${hname}
    pull_policy: ${pull_policy:-missing}
    restart: ${restart:-unless-stopped}
    shm_size: "1gb"
    networks:
      - acp-net
    command: gateway run
    environment:
      - PATH=/root/.local/bin:/opt/data/.local/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=${hdport}
      - HERMES_LOCAL_STT_LANGUAGE=es
      - TZ=${TIMEZONE}
      - HERMES_TIMEZONE=${TIMEZONE}
      - HERMES_DASHBOARD_TUI=1
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${hapikey}
      - API_SERVER_PORT=${hapiport}
      - API_SERVER_HOST=0.0.0.0
      - TERMINAL_ENV=local
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${huser}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${hpass}
      - HERMES_DASHBOARD_PUBLIC_URL=${HERMES_DASHBOARD_PUBLIC_URL}
      - HERMES_QUIET=true
      - learning_acp_orchestrator=${learning_acp_orchestrator}
    ports:
      - ${hapiport}:${hapiport}
      - ${hdport}:${hdport}
    volumes:
      - hermes:/opt/data
      # RIESGO ACEPTADO (ver SECURITY.md): Hermes orquesta contenedores por diseño y
      # el socket equivale a root en el host. Elimine este montaje si no lo necesita.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opencode-workspace:/workspace
    group_add:
      - ${DOCKER_GID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${hapiport}/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

# Proxy del socket Docker con lista blanca: el puente SOLO puede hacer `docker exec` en "opencode".
x-socket-proxy-base: &socket-proxy-base
    image: wollomatic/socket-proxy:${SOCKET_PROXY_TAG:-1}
    hostname: socket-proxy
    container_name: ${acpname}-socket-proxy
    pull_policy: ${pull_policy:-missing}
    restart: ${restart:-unless-stopped}
    user: "65534:${DOCKER_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - acp-docker-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - -loglevel=INFO
      - -listenip=0.0.0.0
      - -allowfrom=${acpname}
      - -allowhealthcheck
      - -shutdowngracetime=5
      - -allowHEAD=^/_ping$$
      - -allowGET=^(/_ping|/v1\.[0-9]+/(containers/opencode/json|exec/[a-f0-9]+/json))$$
      - -allowPOST=^/v1\.[0-9]+/(containers/opencode/exec|exec/[a-f0-9]+/(start|resize))$$
    healthcheck:
      test: ["CMD", "/healthcheck"]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

x-hermes-opencode-bridge-base: &hermes-opencode-bridge-base
    image: sinfallas/hermes-opencode-bridge:${ACP_TAG:-latest}
    hostname: ${acpname}
    container_name: ${acpname}
    pull_policy: ${pull_policy:-missing}
    restart: ${restart:-unless-stopped}
    networks:
      - acp-net
      - acp-docker-net
    ports:
      # Hermes accede por la red interna acp-net; el puerto del host es solo para diagnóstico local.
      - 127.0.0.1:${acpport:-8000}:8000
    environment:
      - TZ=${TIMEZONE}
      - ACP_API_KEY=${acpapikey:?Defina acpapikey en .env}
      - HERMES_API_KEY=${hapikey}
      - HERMES_API_URL=http://${hname}:${hapiport}/v1/chat/completions
      # Vacío => se usa el prompt por defecto del auditor (ver readme.md)
      - HERMES_SECURITY_PROMPT=${HERMES_SECURITY_PROMPT:-}
      - DOCKER_HOST=tcp://socket-proxy:2375
      - OPENCODE_CONTAINER=opencode
      - OPENCODE_TASK_TIMEOUT=${OPENCODE_TASK_TIMEOUT:-900}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-1}
      - MAX_FEEDBACK_ROUNDS=${MAX_FEEDBACK_ROUNDS:-3}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-${acpname}:*,localhost:*,127.0.0.1:*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:size=32M,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      start_period: 5s
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

################################################

networks:
  acp-net:
    driver: bridge
  # Red interna aislada: solo el puente alcanza el proxy del socket Docker.
  acp-docker-net:
    driver: bridge
    internal: true

volumes:
  config-opencode:
  state-opencode:
  share-opencode:
  hermes:

################################################

services:
  opencode:
    <<: *opencode-base
    profiles: ["opencode", "acp-orchestrator"]

  hermes:
    <<: *hermes-base
    profiles: ["hermes", "acp-orchestrator"]

  socket-proxy:
    <<: *socket-proxy-base
    profiles: ["acp-orchestrator"]

  acp-orchestrator:
    <<: *hermes-opencode-bridge-base
    profiles: ["acp-orchestrator"]
    depends_on:
      socket-proxy:
        condition: service_healthy
      opencode:
        condition: service_healthy
      hermes:
        condition: service_healthy
